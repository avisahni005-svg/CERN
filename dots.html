<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Random Dots</title>
<style>
  :root {
    --bg: #111214;
    --panel: #1b1c1f;
    --line: #2c2d31;
    --text: #e8e8ea;
    --muted: #8b8c92;
    --accent: #6aa8ff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex;
    height: 100vh;
    overflow: hidden;
  }
  aside {
    width: 280px;
    flex: none;
    background: var(--panel);
    border-right: 1px solid var(--line);
    padding: 20px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: .02em; }
  .group { display: flex; flex-direction: column; gap: 8px; }
  .row { display: flex; justify-content: space-between; align-items: baseline; }
  label { color: var(--muted); }
  .val { font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .colors { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .color { display: flex; flex-direction: column; gap: 6px; }
  .color div { display: flex; gap: 6px; align-items: center; }
  input[type=color] {
    width: 34px; height: 28px; padding: 0; border: 1px solid var(--line);
    border-radius: 6px; background: none; cursor: pointer;
  }
  input[type=text] {
    width: 100%; min-width: 0; background: #0f1012; color: var(--text);
    border: 1px solid var(--line); border-radius: 6px; padding: 5px 7px;
    font: 12px ui-monospace, monospace;
  }
  .check { display: flex; gap: 8px; align-items: center; color: var(--muted); cursor: pointer; }
  button {
    background: #2a2b30; color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 9px 12px; font: inherit; cursor: pointer;
  }
  button:hover { background: #33353b; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #0b1220; font-weight: 600; }
  button.primary:hover { filter: brightness(1.08); }
  .buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .buttons .primary { grid-column: 1 / -1; }
  .stats { color: var(--muted); font-size: 12px; border-top: 1px solid var(--line); padding-top: 14px; }
  .stats b { color: var(--text); font-weight: 500; }
  .hint { color: var(--muted); font-size: 11px; }
  main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    min-width: 0;
  }
  canvas {
    display: block;
    max-width: 100%;
    max-height: 100%;
    aspect-ratio: 1080 / 1920;
    height: calc(100vh - 48px);
    width: auto;
    box-shadow: 0 10px 40px rgba(0,0,0,.5);
    background:
      repeating-conic-gradient(#2a2a2a 0% 25%, #3a3a3a 0% 50%) 0 0 / 20px 20px;
  }
  @media (max-width: 700px) {
    body { flex-direction: column; height: auto; overflow: auto; }
    aside { width: 100%; border-right: 0; border-bottom: 1px solid var(--line); }
    main { padding: 16px; }
    canvas { width: 100%; height: auto; }
  }
</style>
</head>
<body>
<aside>
  <h1>Random Dots · 1080 × 1920</h1>

  <div class="group">
    <div class="row"><label for="size">Dot size (radius)</label><span class="val" id="sizeVal"></span></div>
    <input type="range" id="size" min="3" max="200" step="1" value="18">
  </div>

  <div class="group">
    <div class="row"><label for="density">Density</label><span class="val" id="densityVal"></span></div>
    <input type="range" id="density" min="1" max="100" step="1" value="60">
  </div>

  <div class="group">
    <div class="row"><label for="gap">Min gap between dots</label><span class="val" id="gapVal"></span></div>
    <input type="range" id="gap" min="0" max="200" step="1" value="4">
  </div>

  <div class="colors">
    <div class="color">
      <label for="dotColor">Dot color</label>
      <div><input type="color" id="dotColor" value="#ffffff"><input type="text" id="dotHex" value="#ffffff"></div>
    </div>
    <div class="color">
      <label for="bgColor">Background</label>
      <div><input type="color" id="bgColor" value="#000000"><input type="text" id="bgHex" value="#000000"></div>
    </div>
  </div>

  <label class="check"><input type="checkbox" id="transparent"> Transparent background</label>

  <div class="group">
    <div class="row"><label for="seed">Seed</label></div>
    <input type="text" id="seed">
  </div>

  <div class="buttons">
    <button class="primary" id="randomize">Randomize (R)</button>
    <button id="saveSvg">Save SVG (S)</button>
    <button id="savePng">Save PNG</button>
  </div>

  <div class="stats" id="stats"></div>
  <div class="hint">Dots never overlap. Size and gap change the layout; density adds or removes dots from the same layout. Same seed + settings = same frame.</div>
</aside>

<main>
  <canvas id="c" width="1080" height="1920"></canvas>
</main>

<script>
(() => {
  const W = 1080, H = 1920;
  const $ = id => document.getElementById(id);
  const canvas = $('c');
  const ctx = canvas.getContext('2d');

  const ui = {
    size: $('size'), density: $('density'), gap: $('gap'),
    dotColor: $('dotColor'), dotHex: $('dotHex'),
    bgColor: $('bgColor'), bgHex: $('bgHex'),
    transparent: $('transparent'), seed: $('seed'),
  };

  let seed = newSeed();
  ui.seed.value = seed;

  // Cache of the full packed layout for (seed, radius, gap)
  let cacheKey = '';
  let layout = null;   // { xs, ys, order, n }
  let visible = 0;

  function newSeed() { return Math.floor(Math.random() * 1e9).toString(36); }

  function hashSeed(str) {
    let h = 1779033703 ^ str.length;
    for (let i = 0; i < str.length; i++) {
      h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
      h = (h << 13) | (h >>> 19);
    }
    return h >>> 0;
  }

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // Bridson Poisson-disk sampling: centers at least `minDist` apart,
  // inside [x0, x0+w] x [y0, y0+h]. Produces a near-maximal random packing.
  function poisson(x0, y0, w, h, minDist, rng, k = 30) {
    const xs = [], ys = [];
    if (w < 0 || h < 0) return { xs, ys };
    const cell = minDist / Math.SQRT2;
    const gw = Math.max(1, Math.ceil(w / cell) + 1);
    const gh = Math.max(1, Math.ceil(h / cell) + 1);
    const grid = new Int32Array(gw * gh).fill(-1);
    const md2 = minDist * minDist;
    const active = [];

    const add = (x, y) => {
      const i = xs.length;
      xs.push(x); ys.push(y);
      grid[Math.floor(y / cell) * gw + Math.floor(x / cell)] = i;
      active.push(i);
    };

    const ok = (x, y) => {
      const gx = Math.floor(x / cell), gy = Math.floor(y / cell);
      const x1 = Math.max(0, gx - 2), x2 = Math.min(gw - 1, gx + 2);
      const y1 = Math.max(0, gy - 2), y2 = Math.min(gh - 1, gy + 2);
      for (let yy = y1; yy <= y2; yy++) {
        const row = yy * gw;
        for (let xx = x1; xx <= x2; xx++) {
          const j = grid[row + xx];
          if (j !== -1) {
            const dx = xs[j] - x, dy = ys[j] - y;
            if (dx * dx + dy * dy < md2) return false;
          }
        }
      }
      return true;
    };

    add(rng() * w, rng() * h);

    while (active.length) {
      const ai = Math.floor(rng() * active.length);
      const p = active[ai];
      const px = xs[p], py = ys[p];
      let placed = false;
      for (let t = 0; t < k; t++) {
        const a = rng() * Math.PI * 2;
        const d = minDist * (1 + rng() * 1.0001);
        const x = px + Math.cos(a) * d, y = py + Math.sin(a) * d;
        if (x < 0 || y < 0 || x > w || y > h) continue;
        if (ok(x, y)) { add(x, y); placed = true; break; }
      }
      if (!placed) { active[ai] = active[active.length - 1]; active.pop(); }
    }

    for (let i = 0; i < xs.length; i++) { xs[i] += x0; ys[i] += y0; }
    return { xs, ys };
  }

  function getParams() {
    return {
      r: +ui.size.value,
      density: +ui.density.value,
      gap: +ui.gap.value,
      dot: ui.dotColor.value,
      bg: ui.bgColor.value,
      transparent: ui.transparent.checked,
    };
  }

  function buildLayout(p) {
    const key = `${seed}|${p.r}|${p.gap}`;
    if (key === cacheKey && layout) return;
    cacheKey = key;
    const rng = mulberry32(hashSeed(seed + ':' + p.r + ':' + p.gap));
    // keep whole circles inside the frame
    const { xs, ys } = poisson(p.r, p.r, W - 2 * p.r, H - 2 * p.r, 2 * p.r + p.gap, rng);
    // stable random order so density adds/removes dots without reshuffling
    const n = xs.length;
    const order = new Uint32Array(n);
    for (let i = 0; i < n; i++) order[i] = i;
    const rng2 = mulberry32(hashSeed(seed + ':order'));
    for (let i = n - 1; i > 0; i--) {
      const j = Math.floor(rng2() * (i + 1));
      const t = order[i]; order[i] = order[j]; order[j] = t;
    }
    layout = { xs, ys, order, n };
  }

  function render() {
    const p = getParams();
    buildLayout(p);
    visible = Math.round(layout.n * p.density / 100);
    if (p.density > 0 && visible === 0 && layout.n > 0) visible = 1;

    ctx.clearRect(0, 0, W, H);
    if (!p.transparent) { ctx.fillStyle = p.bg; ctx.fillRect(0, 0, W, H); }
    ctx.fillStyle = p.dot;
    ctx.beginPath();
    const { xs, ys, order } = layout;
    for (let k = 0; k < visible; k++) {
      const i = order[k];
      ctx.moveTo(xs[i] + p.r, ys[i]);
      ctx.arc(xs[i], ys[i], p.r, 0, Math.PI * 2);
    }
    ctx.fill();

    $('sizeVal').textContent = p.r + ' px';
    $('densityVal').textContent = p.density + '%';
    $('gapVal').textContent = p.gap + ' px';
    $('stats').innerHTML = `<b>${visible.toLocaleString()}</b> dots &nbsp;·&nbsp; max <b>${layout.n.toLocaleString()}</b> at this size`;
  }

  let queued = false;
  function schedule() {
    if (queued) return;
    queued = true;
    requestAnimationFrame(() => { queued = false; render(); });
  }

  function buildSvg() {
    const p = getParams();
    const f = v => Math.round(v * 100) / 100;
    const parts = [
      `<?xml version="1.0" encoding="UTF-8"?>`,
      `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">`,
    ];
    if (!p.transparent) parts.push(`<rect width="${W}" height="${H}" fill="${p.bg}"/>`);
    parts.push(`<g fill="${p.dot}">`);
    const { xs, ys, order } = layout;
    for (let k = 0; k < visible; k++) {
      const i = order[k];
      parts.push(`<circle cx="${f(xs[i])}" cy="${f(ys[i])}" r="${p.r}"/>`);
    }
    parts.push(`</g>`, `</svg>`);
    return parts.join('\n');
  }

  function fileBase() {
    const p = getParams();
    return `dots_${seed}_r${p.r}_d${p.density}_g${p.gap}`;
  }

  function download(blob, name) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }

  function saveSvg() {
    download(new Blob([buildSvg()], { type: 'image/svg+xml' }), fileBase() + '.svg');
  }

  function savePng() {
    canvas.toBlob(b => b && download(b, fileBase() + '.png'), 'image/png');
  }

  function randomize() {
    seed = newSeed();
    ui.seed.value = seed;
    schedule();
  }

  // color pickers <-> hex fields
  function linkColor(picker, hex) {
    picker.addEventListener('input', () => { hex.value = picker.value; schedule(); });
    hex.addEventListener('input', () => {
      let v = hex.value.trim();
      if (!v.startsWith('#')) v = '#' + v;
      if (/^#[0-9a-f]{3}$/i.test(v)) v = '#' + [...v.slice(1)].map(c => c + c).join('');
      if (/^#[0-9a-f]{6}$/i.test(v)) { picker.value = v.toLowerCase(); schedule(); }
    });
  }
  linkColor(ui.dotColor, ui.dotHex);
  linkColor(ui.bgColor, ui.bgHex);

  [ui.size, ui.density, ui.gap].forEach(el => el.addEventListener('input', schedule));
  ui.transparent.addEventListener('change', schedule);
  ui.seed.addEventListener('change', () => {
    seed = ui.seed.value.trim() || newSeed();
    ui.seed.value = seed;
    schedule();
  });

  $('randomize').addEventListener('click', randomize);
  $('saveSvg').addEventListener('click', saveSvg);
  $('savePng').addEventListener('click', savePng);

  window.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT' && e.target.type === 'text') return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === 'r' || e.key === 'R') randomize();
    if (e.key === 's' || e.key === 'S') saveSvg();
  });

  render();
})();
</script>
</body>
</html>
