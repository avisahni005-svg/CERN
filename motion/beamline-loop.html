const LEAD_MAX = 46;               // extra leading (px) at the peak of the move

// ---- easing: cubic-bezier(.76,0,.24,1) — a long, soft ease in and out ---
function bezier(x1, y1, x2, y2) {
  const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
  const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
  const sx = t => ((ax * t + bx) * t + cx) * t;
  const sy = t => ((ay * t + by) * t + cy) * t;
  const dx = t => (3 * ax * t + 2 * bx) * t + cx;
  return x => {
    if (x <= 0) return 0; if (x >= 1) return 1;
    let t = x;
    for (let i = 0; i < 8; i++) { const d = dx(t); if (Math.abs(d) < 1e-6) break; t -= (sx(t) - x) / d; }

    // bisection polish
    let lo = 0, hi = 1;
    for (let i = 0; i < 20 && Math.abs(sx(t) - x) > 1e-7; i++) { if (sx(t) < x) lo = t; else hi = t; t = (lo + hi) / 2; }
    return sy(t);
  };
}

const clamp01 = v => Math.min(1, Math.max(0, v));

// ---- layout ------------------------------------------------------------

const tplEls = ORDER.map(id => document.getElementById('tpl-' + id));
const REST = tplEls.map(t => +t.dataset.c);       // rest centres exactly as in the artboard
const OFF = 722;                                  // spacing used beyond the frame edges
const SLOT_Y = [REST[0] - OFF, REST[0], REST[1], REST[2], REST[2] + OFF];
const slotY = s => SLOT_Y[s + 1];

const host = document.getElementById('bands');
const SVGNS = 'http://www.w3.org/2000/svg';
function makeVisual(tpl) {
  const g = document.createElementNS(SVGNS, 'g');
  g.appendChild(tpl.firstElementChild.cloneNode(true));
  host.appendChild(g);
  return {
    g,
    box: g.querySelector('.box'),
    top: g.querySelector('.lead-top'),
    bot: g.querySelector('.lead-bot'),
    lines: [...g.querySelectorAll('.ln')],
    t0: +tpl.dataset.top, t1: +tpl.dataset.bot, n: +tpl.dataset.n,
  };
}
// each band gets a main copy and a wrap copy (the one re-entering from the bottom)
const visuals = tplEls.map(t => ({ main: makeVisual(t), wrap: makeVisual(t) }));

function place(v, y, extra) {
  const G = (v.n - 1) * extra;                     // total growth of the text block
  v.g.setAttribute('transform', `translate(0,${y.toFixed(3)})`);
  v.box.setAttribute('y', (v.t0 - G / 2).toFixed(3));
  v.box.setAttribute('height', (v.t1 - v.t0 + G).toFixed(3));
  v.top.setAttribute('transform', `translate(0,${(-G / 2).toFixed(3)})`);
  v.bot.setAttribute('transform', `translate(0,${(G / 2).toFixed(3)})`);
  v.lines.forEach((l, j) => l.setAttribute('transform', `translate(0,${(j * extra - G / 2).toFixed(3)})`));
}

function motion(from, tseg) {
  // `from` = slot at the start of this step (0 top … 3 below frame); higher bands lead
  const p = clamp01((tseg - HOLD - from * STAG) / MOVE);
  const e = ease(p);
  const y = slotY(from) + (slotY(from - 1) - slotY(from)) * e;
  const extra = LEAD_MAX * Math.sin(Math.PI * p) ** 2;   // leading opens on the move, closes on arrival
  return { y, extra };
}

const BEAT = DURATION / DOTS.layouts.length;          // how long each set stays (0.4 s)
const dotsHost = document.getElementById('dots');
dotsHost.setAttribute('fill', DOTS.color);
let shownSet = -1;
function showDots(t) {
  const k = Math.min(DOTS.layouts.length - 1, Math.floor(t / BEAT + 1e-9));
  if (k === shownSet) return;
  shownSet = k;
  dotsHost.innerHTML = DOTS.layouts[k].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="${DOTS.r}"/>`).join('');
}

function render(t) {
  t = ((t % DURATION) + DURATION) % DURATION;
  showDots(t);
  const k = Math.floor(t / SEG), tseg = t - k * SEG;
  visuals.forEach((v, b) => {
    const s = ((b - k) % 3 + 3) % 3;
    const m = motion(s, tseg);
    place(v.main, m.y, m.extra);
    if (s === 0) {                                  // leaving at the top -> its twin rises in from below
      const w = motion(3, tseg);
      place(v.wrap, w.y, w.extra);
      v.wrap.g.style.display = '';
    } else {
      v.wrap.g.style.display = 'none';
    }
  });
}
window.render = render;
window.DURATION = DURATION;

if (new URLSearchParams(location.search).has('capture')) {
  document.body.classList.add('capture');
  render(0);
} else {
  const start = performance.now();
  const tick = now => { render((now - start) / 1000); requestAnimationFrame(tick); };
  requestAnimationFrame(tick);
}
